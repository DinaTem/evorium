<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#fafafa;
}

.sidebar{
    position:fixed;
    width:170px;
    height:100vh;
    background:white;
    border-right:1px solid #eee;
    padding:40px;
}

.sidebar h2{
    margin-bottom:40px;
}

.sidebar p{
    margin:20px 0;
    color:#666;
}

.main{
    margin-left:260px;
    padding:32px;
}

.card{
    background:white;
    padding:30px;
    border-radius:18px;
    max-width:500px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
}
.content{
    display:flex;
    gap:32px;
    height:calc(100vh - 120px);
}

.panel{
    flex:1;
    background:white;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
    padding:24px;
    overflow-y:auto;
}

.panel h2{
    margin-top:0;
}
</style>

</head>

<body>

<div class="sidebar">
<h2>EVORIUM</h2>

<p>Dashboard</p>
<p>Students</p>
<p>Lessons</p>
<p>Homework</p>
<p>Settings</p>

</div>

<div class="main">

<h1>Good morning, Dina 👋</h1>

<div class="content">

    <div class="panel">
        <h2>Today's Lessons</h2>
    </div>

    <div class="panel">
        <h2>Today's Tasks</h2>
    </div>

</div>

</body>
</html>
