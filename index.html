<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evorium</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#ffffff;
            color:#111111;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .container{
            text-align:center;
            max-width:700px;
            padding:40px;
        }

        h1{
            font-size:72px;
            font-weight:700;
            letter-spacing:-3px;
            margin-bottom:20px;
        }

        .evo{
            color:#7A5AF8;
        }

        p{
            font-size:24px;
            color:#555;
            line-height:1.6;
            margin-bottom:50px;
        }

        .coming{
            display:inline-block;
            padding:14px 28px;

            border:1px solid #ddd;
            border-radius:999px;

            font-size:15px;
            color:#666;
        }

    </style>

</head>

<body>

<div class="container">

<h1><span class="evo">EVO</span>rium</h1>

<p>
Language learning is evolving.
</p>

<div class="coming">
Coming Soon
</div>

</div>

</body>
</html>
