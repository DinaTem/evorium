<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#fafafa;
}

.sidebar{
    position:fixed;
    width:170px;
    height:100vh;
    background:white;
    border-right:1px solid #eee;
    padding:40px;
}

.sidebar h2{
    margin-bottom:40px;
}

.sidebar p{
    margin:20px 0;
    color:#666;
}

.main{
    margin-left:260px;
    padding:32px;
}

.card{
    background:white;
    padding:30px;
    border-radius:18px;
    max-width:500px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
}
.content{
    display:flex;
    gap:32px;
    height:calc(100vh - 120px);
}

.panel{
    flex:1;
    background:white;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
    padding:24px;
    overflow-y:auto;
}

.panel h2{
    margin-top:0;
}
.sidebar a{
    display:block;
    color:#555;
    text-decoration:none;
    transition:.2s;
}

.sidebar a:hover{
    color:#6D5DF6;
}

.sidebar a.active{
    color:#6D5DF6;
    font-weight:600;
}
.schedule-panel{
    width:100%;
}
    .calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.calendar-header button{
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
    color:#666;
}

.calendar-header button:hover{
    color:#6D5DF6;
}
.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-weight:600;
    color:#777;
    margin-bottom:24px;
}
</style>

</head>

<body>

<div class="sidebar">
<h2>EVORIUM</h2>

<p><a href="dashboard.html" class="active">Dashboard</a></p>
<p><a href="schedule.html">Schedule</a></p>
<p>Students & Lessons</p>
<p>Dictionary</p>
<p>Library</p>
<p>Settings</p>

</div>

<div class="main">

<h1>Schedule</h1>

<div class="content">

    <div class="panel schedule-panel">
        <div class="calendar-header">
    <button>←</button>

    <h2>28 Jul – 3 Aug</h2>

    <button>→</button>

</div>
<div class="weekdays">
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
    <div>Sun</div>
</div>
</body>
</html>
